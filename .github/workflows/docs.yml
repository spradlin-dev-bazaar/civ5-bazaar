name: Docs site

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release whose docs site to publish again, such as v0.3.0
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A release runs this from its tag, so the github-pages environment must let tags v* deploy as well as main.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Unpack the release's docs zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "Bazaar-docs-${TAG#v}.zip"
          unzip -q "Bazaar-docs-${TAG#v}.zip" -d site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
