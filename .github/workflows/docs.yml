name: Docs site

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  # A release runs this file as it is at the release's tag, on any version's branch, so that run only starts the
  # default branch's copy, the only copy that builds the site.
  ask:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Ask the default branch's copy of this Action to build the site again
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  # This check is a job of its own because, on any other branch, GitHub refuses the publish job's github-pages
  # environment before any step of the publish job runs, and the check's message would never show.
  check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Stop unless this runs on the default branch
        if: github.ref_name != github.event.repository.default_branch
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "::error::Run this Action on $BRANCH, the default branch, which builds the site for every version."
          exit 1

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools/docs/gather_site.py
          sparse-checkout-cone-mode: false
      - name: Gather the site from the releases' docs zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/docs/gather_site.py --repo "$GITHUB_REPOSITORY" site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
